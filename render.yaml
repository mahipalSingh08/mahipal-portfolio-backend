services:
  - type: web
    name: portfolio-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_DOCS
        value: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: portfolio
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_USER_ID
        sync: false
      - key: AUTH_PASSWORD_HASH
        sync: false
      - key: AUTH_SESSION_DURATION_MINUTES
        value: 60
